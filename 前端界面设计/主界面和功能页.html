<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾邮件分类系统 - 主页面</title>

<header>
    <div class="nav-left">
        <h1>垃圾邮件分类系统</h1>
        <nav>
            <ul>
                <li><a href="主界面和功能页.html" class="active">首页</a></li>
                <li><a href="邮件上传.html">上传邮件</a></li>
                <li><a href="在线分类.html">在线分类</a></li>
                <li><a href="分类结果.html">分类结果</a></li>
                <li><a href="反馈.html">反馈</a></li>
            </ul>
        </nav>
    </div>
    <div class="nav-right">
        <!-- 直接调用弹出登录框 -->
        <a href="javascript:void(0)" onclick="openLoginModal()">登录</a> | <a href="javascript:void(0)" onclick="openRegisterModal()">注册</a>
    </div>
</header>

<main>
    <section id="home">
        <h2>欢迎使用垃圾邮件分类系统</h2>
        <p>本系统通过先进的深度学习技术，对电子邮件进行智能分类。想要使用垃圾邮件检测功能，请先注册或登录。</p>
        <div class="feature-grid">
            <div class="feature-card">
                <h3>智能分类</h3>
                <p>采用先进的机器学习算法，准确识别垃圾邮件</p>
            </div>
            <div class="feature-card">
                <h3>实时检测</h3>
                <p>快速响应，即时获取分类结果</p>
            </div>
            <div class="feature-card">
                <h3>用户反馈</h3>
                <p>支持用户反馈，持续优化系统性能</p>
            </div>
        </div>
    </section>

    <section id="upload" class="hidden-section">
        <h2>上传或输入邮件</h2>
        <p>请先登录后再使用上传功能</p>
    </section>

    <section id="result" class="hidden-section">
        <h2>分类结果</h2>
        <p>请先登录后再查看分类结果</p>
    </section>

    <section id="feedback" class="hidden-section">
        <h2>用户反馈</h2>
        <p>请先登录后再提交反馈</p>
    </section>
</main>

<!-- 登录弹窗 -->
<div id="loginModal" class="modal ">
    <div class="modal-content">
        <span class="close" onclick="closeLoginModal()">&times;</span>
        <h2>用户登录</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="modalUsername" style="text-align: left">用户名</label>
                <input type="text" id="modalUsername" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="modalPassword" style="text-align: left">密码</label>
                <input type="password" id="modalPassword" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <p style="text-align: left">没有账号？ <a href="javascript:void(0);" onclick="switchToRegister()">立即注册</a>
        </p>

    </div>
</div>

<!-- 注册弹窗 -->
<div id="registerModal" class="modal" >
    <div class="modal-content">
        <span class="close" onclick="closeRegisterModal()">&times;</span>
        <h2>用户注册</h2>
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="registerUsername" style="text-align: left">用户名</label>
                <input type="text" id="registerUsername" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="registerEmail" style="text-align: left">邮箱</label>
                <input type="email" id="registerEmail" name="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
                <label for="registerPassword" style="text-align: left">密码</label>
                <input type="password" id="registerPassword" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">注册</button>
        </form>
        <p style="text-align: left">已有账号？ <a href="javascript:void(0);" onclick="switchToLogin()">立即登录</a></p>
    </div>
</div>


<script>
        // 模拟用户未登录状态
        let isLoggedIn = false; // 实际项目中由后端判断

        // 打开登录弹窗
        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'block';
        }

        // 关闭登录弹窗
        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        // 表单提交示例，实际请与后端对接
        function handleLogin(event) {
            event.preventDefault();
            // 这里模拟登录成功，实际应验证账号密码
            isLoggedIn = true;
            alert("登录成功！");
            closeLoginModal();
        }

        // 检测是否登录，未登录则弹出登录框
        function requireLogin(event) {
            if (!isLoggedIn) {
                event.preventDefault();
                openLoginModal();
            }
        }

        // 打开注册弹窗
        function openRegisterModal() {
            document.getElementById('registerModal').style.display = 'block';
        }

        // 关闭注册弹窗
        function closeRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
        }

        // 切换到注册弹窗
        function switchToRegister() {
            closeLoginModal();
            openRegisterModal();
        }

        // 切换到登录弹窗
        function switchToLogin() {
            closeRegisterModal();
            openLoginModal();
        }

        // 处理注册提交（实际需对接后端）
        function handleRegister(event) {
            event.preventDefault();
            alert("注册成功！");
            switchToLogin(); // 注册成功后自动跳转到登录
        }
